[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mapeamento-verde-api"
version = "0.1.0"
description = "API de busca, composição e cálculo de índices espectrais (Sentinel-2, Landsat, HLS, Sentinel-1)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "numpy>=2.3,<3",
  "xarray>=2026.9",
  "dask>=2026.8",
  "rasterio>=1.5,<2",
  "rio-tiler>=9.4,<10",
  "odc-stac>=0.5.3,<0.6",
  "odc-geo>=0.5.3,<0.6",
  "pystac-client>=0.9,<0.10",
  "planetary-computer>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::rasterio.errors.NotGeoreferencedWarning",
  # avisos internos de bibliotecas de terceiros (odc-geo, planetary-computer)
  "ignore::DeprecationWarning:odc.*",
  "ignore::PendingDeprecationWarning:odc.*",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam acentos/travessões
