name: mapeamento-verde

services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      MV_STORAGE_DIR: /data
      MV_MAX_AOI_KM2: ${MV_MAX_AOI_KM2:-2500}
      MV_MAX_CONCURRENT_JOBS: ${MV_MAX_CONCURRENT_JOBS:-1}
      MV_TARGET_CRS: ${MV_TARGET_CRS:-EPSG:31983}
    volumes:
      - storage:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage:
