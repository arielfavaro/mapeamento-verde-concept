server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API e tiles vão para o backend (nome do serviço no docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a busca com estimativa de nuvem na área pode levar alguns minutos
        proxy_read_timeout 600s;
        # downloads grandes (ZIP) direto do backend, sem bufferizar em disco
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # arquivos com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }
}
